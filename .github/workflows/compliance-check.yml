name: Compliance Check

on:
  pull_request:
    branches: [main]

jobs:
  policy-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: 01-iso27001-nist-csf/terraform
        run: terraform init -backend=false

      - name: Terraform Plan
        working-directory: 01-iso27001-nist-csf/terraform
        run: terraform plan -refresh=false -out=tfplan

      - name: Convert Terraform plan to JSON
        working-directory: 01-iso27001-nist-csf/terraform
        run: terraform show -json tfplan > ../evidence/terraform_plan.json

      - name: Install conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.56.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Run policy checks
        run: conftest test 01-iso27001-nist-csf/evidence/terraform_plan.json -p 01-iso27001-nist-csf/policy/ --all-namespaces