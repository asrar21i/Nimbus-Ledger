name: ISO27001 / NIST CSF Policy Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  conftest-policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Install Conftest
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          wget "https://github.com/open-policy-agent/conftest/releases/download/v${LATEST_VERSION}/conftest_${LATEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${LATEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/

      - name: Run Rego Unit Tests
        run: |
          opa test 01-iso27001-nist-csf/policy/ -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init & Plan
        working-directory: 01-iso27001-nist-csf/terraform
        env:
          AWS_ACCESS_KEY_ID: mock_access_key
          AWS_SECRET_ACCESS_KEY: mock_secret_key
          AWS_REGION: us-east-1
        run: |
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > ../evidence/sample_plan.json

      - name: Evaluate Policy Compliance against Terraform Plan
        run: |
          conftest test 01-iso27001-nist-csf/evidence/sample_plan.json \
            --policy 01-iso27001-nist-csf/policy