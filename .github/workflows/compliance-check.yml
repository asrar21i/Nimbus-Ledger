name: ISO27001 / NIST CSF Policy Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  conftest-policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Setup Conftest
        uses: open-policy-agent/conftest-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Rego Unit Tests
        run: |
          opa test 01-iso27001-nist-csf/policy/ -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init & Plan
        working-directory: 01-iso27001-nist-csf/terraform
        run: |
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > ../evidence/sample_plan.json

      - name: Evaluate Policy Compliance against Terraform Plan
        run: |
          conftest test 01-iso27001-nist-csf/evidence/sample_plan.json \
            --policy 01-iso27001-nist-csf/policy